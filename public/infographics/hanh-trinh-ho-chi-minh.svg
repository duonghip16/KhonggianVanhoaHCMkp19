<title id="title">Cuộc đời Chủ tịch Hồ Chí Minh — Bốn dấu mốc</title><desc id="desc">1890: sinh tại Nghệ An. 1911: ra đi tìm đường cứu nước. 1945: đọc Tuyên ngôn Độc lập. 1969: qua đời tại Hà Nội. Biên soạn từ tư liệu Sở Khoa học và Công nghệ TP.HCM và Báo Điện tử Chính phủ.</desc>
