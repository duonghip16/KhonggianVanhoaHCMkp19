<g fill="#202020" font-size="30" font-weight="700"><text x="195" y="515">Ngày sinh Chủ tịch Hồ Chí Minh</text><text x="195" y="725">Ra đi tìm đường cứu nước</text><text x="195" y="935">Đọc Tuyên ngôn Độc lập</text><text x="195" y="1145">Chủ tịch Hồ Chí Minh qua đời</text></g>
