<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img" aria-labelledby="t d"><title id="t">Hồ sơ giới thiệu Sửa đổi lối làm việc</title><desc id="d">Bìa hồ sơ do Khu phố 19 thiết kế, không phải bìa một ấn bản gốc. Tác giả Hồ Chí Minh, bút danh X.Y.Z., hoàn thành tháng 10 năm 1947.</desc><rect width="600" height="840" fill="#075B52"/><rect x="24" y="24" width="552" height="792" fill="none" stroke="#D9B45B"/><g font-family="Arial,sans-serif"><text x="60" y="93" font-size="16" letter-spacing="2" fill="#D9B45B">THƯ VIỆN SỐ · KHU PHỐ 19</text><text x="60" y="190" font-size="24" fill="#FFF9ED">HỒ CHÍ MINH · X.Y.Z.</text><g fill="#FFF9ED" font-size="57" font-weight="700"><text x="60" y="305">Sửa đổi</text><text x="60" y="380">lối làm việc</text></g><path d="M60 440H190" stroke="#D9B45B" stroke-width="3"/><text x="60" y="500" fill="#D9B45B" font-size="54">1947</text><g fill="#FFF9ED" font-size="22"><text x="60" y="625">HỒ SƠ TÁC PHẨM</text><text x="60" y="662">Bản đọc giới thiệu</text></g><g fill="#D9B45B" font-size="16"><text x="60" y="750">Khu phố 19 biên soạn và thiết kế</text><text x="60" y="777">Nguồn: Bảo tàng Hồ Chí Minh</text></g></g></svg>
